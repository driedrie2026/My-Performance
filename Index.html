:root[data-theme="light"]{--page:#f4f0ea;--surface:#ffffff;--surface-2:#efe9e0;--text:#1d1b19;--muted:#6b6358;--accent:#E85100;--accent-2:#557561;--line:#ddd5c9;--green:#557561;--amber:#c98a1c;--red:#b8371f;--grid:#cfc6b8;--th:#e8e1d6;--zebra:rgba(0,0,0,.03);--hatch:rgba(0,0,0,.05);--cream-bar:#34312e;--logo:var(--logo-light)}

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--page);color:var(--text);font-family:'Archivo','Segoe UI',Arial,sans-serif;font-size:13px;-webkit-text-size-adjust:100%}
body{min-height:100vh}
button,input,select,textarea{font-family:inherit;font-size:13px;color:var(--text)}
a{color:var(--accent)}
#hdr{position:fixed;top:0;left:0;right:0;height:var(--hdr);background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:50}
.brand{font-weight:700;font-size:20px;letter-spacing:-.5px;white-space:nowrap}.brand i{font-style:normal;color:var(--accent)}
.logo{display:inline-block;height:30px;width:131px;flex:none;background:var(--logo) left center/contain no-repeat}.hsep{width:1px;height:24px;background:var(--line);flex:none}
.ttl{font-weight:600;font-size:14px;letter-spacing:1.4px;text-transform:uppercase;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hmeta{margin-left:auto;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;white-space:nowrap;min-width:0}
#hPub{overflow:hidden;text-overflow:ellipsis;max-width:300px}#hMode select{max-width:190px}
@media (max-width:1700px){.hmeta .em{display:none}}@media (max-width:1650px){#hPub{display:none}}@media (max-width:1000px){#hBuild,#hMode{display:none}.ttl{font-size:12px;letter-spacing:.8px}}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;letter-spacing:.5px;border:1px solid var(--line);background:var(--surface-2)}
.badge.sa{color:var(--accent);border-color:var(--accent)}
.btn{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);border-color:var(--accent);color:#0b0b0d;font-weight:700}
.btn.sm{padding:3px 8px;font-size:11px}.btn[disabled]{opacity:.45;cursor:not-allowed}.btn.on{border-color:var(--accent);color:var(--accent)}.btn.dng{border-color:var(--red);color:#ee7a65}
#burger{background:none;border:0;cursor:pointer;padding:4px;color:var(--text)}
#nav{position:fixed;top:var(--hdr);bottom:0;left:0;width:var(--nav);background:var(--surface);border-right:1px solid var(--line);padding:10px 0;overflow-y:auto;z-index:40;transition:width .15s}
.ni{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer;color:var(--muted);border-left:3px solid transparent;white-space:nowrap}
.ni:hover{color:var(--text);background:var(--surface-2)}.ni.on{color:var(--text);border-left-color:var(--accent);background:var(--surface-2)}
.ni svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.ni.on svg{stroke:var(--accent)}
body.collapsed{--nav:56px}body.collapsed .ni span{display:none}body.collapsed .ni{padding:10px 18px}
#main{margin-left:var(--nav);padding:calc(var(--hdr) + 8px) 18px 50px;transition:margin .15s}
#foot{margin-left:var(--nav);padding:14px 18px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);text-align:center}
#fb{position:sticky;top:var(--hdr);z-index:30;background:var(--page);padding:6px 18px;margin:0 -18px 6px;border-bottom:1px solid var(--line)}
.fr{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.dd{position:relative}.dd>button{min-width:0;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 8px;cursor:pointer;display:flex;justify-content:space-between;gap:6px;height:28px;align-items:center;font-size:12px}
.dd>button b{font-weight:500;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:1px}
.dd-panel{display:none;position:absolute;top:100%;left:0;margin-top:3px;min-width:220px;max-height:320px;overflow:auto;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.5);z-index:60;padding:6px}
.dd.open .dd-panel{display:block}
.box.ctl{overflow:visible;position:relative;z-index:5}.box.ctl .dd-panel{left:auto;right:0;width:260px;z-index:80}.box.ctl .dd-panel label{display:flex;flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;text-align:left;text-transform:none;letter-spacing:0;font-size:12px;color:var(--text);padding:5px 6px;margin:0}.box.ctl .dd-panel input[type=checkbox]{margin:0;flex:none}
.dd-panel label{display:flex;gap:8px;align-items:center;padding:5px 6px;cursor:pointer;border-radius:4px}.dd-panel label:hover{background:var(--surface)}
.dd-q{width:100%;margin-bottom:4px}
.bc{display:flex;flex-wrap:wrap;gap:5px;color:var(--muted);font-size:11px;align-items:center;flex:1 1 auto;margin-left:4px}
.chip{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:1px 8px;color:var(--text)}.chip.pend{border-style:dashed;color:var(--amber)}
#fb .btn{height:28px;padding:0 10px}
h1.pt{font-size:12px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:10px 0 10px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1.pt .vc{margin-left:auto;display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-weight:400}
.row{display:flex;flex-wrap:wrap;gap:12px}.row>*{flex:1 1 360px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px;margin-bottom:14px}
.kpis.c4{grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}.kpis.c4 .kpi{padding:10px 6px}.kpis.c4 .kpi .kl{font-size:9.5px;letter-spacing:.5px;line-height:1.25;min-height:24px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:2px}.kpis.c4 .kpi .kv{font-size:22px}.kpis.c4 .kpi .ks{font-size:10.5px}.kpis.c4 .kpi .pill{font-size:10px;padding:1px 6px}.kpis.c5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:1180px){.kpis.c4{grid-template-columns:repeat(4,minmax(0,1fr))}.kpis.c4 .kpi .kl{font-size:11px}.kpis.c4 .kpi .kv{font-size:26px}}@media (max-width:900px){.kpis.c4,.kpis.c5{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 10px;text-align:center;position:relative;overflow:hidden}
.kpi .kl{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);font-weight:600;text-align:center}
.kpi .kv{font-size:30px;font-weight:700;line-height:1.15;margin:4px 0 2px;text-align:center}
.kpi .ks{font-size:12px;color:var(--muted);text-align:center}.kpi .kr{margin-top:5px;text-align:center}
.kpi.g::before,.kpi.a::before,.kpi.r::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px}

  var h = pageHead('Help Center — glossary, formulas and data quality', { noView: true, sub: 'BUILD ' + BUILD });
  h += '<div class="box"><div class="cb">NewsBreak (iOPEX Manila) content-moderation operations rolled up into three LOBs — <b>VM</b> (Video Moderation I / II, Circle), <b>CM</b> (Comments Moderation, Crime Radar, Curation, Contributor, Support/Ru) and <b>AM</b> (Article Moderation, AIGC per setting) — with drill-down to sub-programs, TLs and agents. Tabs are matched by <b>header signature</b>, not by name, so the Google Sheet and the master workbook both load. A missing tab or column hides the KPIs that depend on it (empty-state card) — it is never shown as zero. Every rate is Σ numerator ÷ Σ denominator at the selected grain. <b>Dates as in source (PST)</b> — never shifted. Insights are rule-based; no AI calls.<br><br><b>BUILD ' + esc(BUILD) + '</b> · data source: ' + esc((S.init && S.init.dataSource) || '') + ' · mode: ' + esc((S.init && S.init.mode) || '') + '</div></div>';
  h += tbl('help-gloss', { title: 'Metric glossary', sub: 'definition and formula', rows: LIB.REGISTRY.filter(function (m) { return m.page !== 'targets'; }).map(function (m) { return { id: m.id, label: m.label, unit: m.unit, dir: m.dir, page: m.page, gl: m.gl }; }), emptyTitle: 'No metrics',
    cols: [{ k: 'label', h: 'Metric', l: 1 }, { k: 'gl', h: 'Definition / formula', l: 1, wrap: 1 }, { k: 'unit', h: 'Unit', l: 1 }, { k: 'dir', h: 'Better', l: 1, f: function (v) { return v === 'up' ? 'higher' : v === 'down' ? 'lower' : 'n/a'; } }] });
  h += tbl('help-const', { title: 'Constants & assumptions', sub: 'every constant the dashboard uses', rows: [
    { k: 'HOURS_PER_LOGIN', v: String(S.o.hoursPerLogin), d: 'Content/Agent/Hour = Productivity ÷ (Logins × this) when login hours are not available. Setting.' },
    { k: 'Per-login daily targets', v: S.T.filter(function (t) { return t.metric.indexOf('tpl.') === 0; }).map(function (t) { return LIB.subName(t.metric.substr(4)) + ' ' + t.target; }).join(' · '), d: 'Seeded from the Agent Database lookup (VM 675, CM 600, AM 300, Curation 375, Contribution 75, AIGC 225). Video Moderator II is blank in the lookup → seeded 675, UNCONFIRMED. Crime Radar and Circle have no target.' },
    { k: 'RAG', v: 'Green ≥ 100% · Amber ≥ 90% · Red < 90%', d: 'Reversed for lower-is-better metrics.' }, { k: 'Attendance target', v: '≥ 90%', d: 'Target row attPct.' },
    { k: 'Logins source', v: 'roster history → per-agent CAD → program CAD → distinct active agents', d: 'First available source per sub-program (the live sheet has only the older program × day CAD).' },
    { k: 'LOB by source tab', v: 'every row read from the ARTICLE MODERATION tab belongs to AM; every row from the VIDEO MODERATION tab belongs to VM', d: 'Rows in the ARTICLE MODERATION tab whose Team says “VIDEO MODERATION II” are shown as the AM line “Tickets handled by VM agents”: in AM Total Productivity and overall Goal Attainment, never Support, no logins or target of their own, and not in System − Manual. Video Moderation II itself comes only from rows in the VIDEO MODERATION tab. CAD attendance for the VM II program still maps to VM.' },
    { k: 'Support (TL / Senior TL / Support)', v: 'a person with a Team Lead / Senior Team Lead designation, named as somebody’s TL, or CM Mail Team = TL', d: 'Their productivity is ONE Support line per LOB (VM / CM / AM): in Total Productivity and in OVERALL Goal Attainment, but not in agent productivity, leaderboards or the agent pickers. System − Manual (AM) also includes it. Tickets handled by VM agents are NOT Support.' }, { k: 'Avg video length / Avg review time', v: 'Σ video length ÷ Σ count (VM)', d: 'ASSUMED to be the scorecard Avg Review Time — confirm.' },
    { k: 'Absenteeism / Shrinkage', v: 'Absent ÷ (Sched − VL) · (Absent + VL) ÷ Sched', d: 'ASSUMED definitions — confirm with the CAD owner.' }, { k: 'Week', v: 'WEEKNUM (Sunday start)', d: '1-Oct-2026 = Week 40, as in the source.' },
    { k: 'Agent identity', v: 'lower-case · _ → . · @newsbreak.com → roster Iopex ID · leading spaces / date-serial prefix stripped · names collapsed', d: 'Agents not in the roster are kept under TL “Unmapped” and counted in Data Quality.' }], emptyTitle: 'None',
    cols: [{ k: 'k', h: 'Constant', l: 1 }, { k: 'v', h: 'Value', l: 1, wrap: 1 }, { k: 'd', h: 'Note', l: 1, wrap: 1 }] });
  var sd = S.init && S.init.srcDq; var mt = (S.ds.dq.matched || []).length ? S.ds.dq.matched : (sd ? sd.matched : []);
  if (mt && mt.length) h += tbl('help-tabs', { title: 'Matched tabs (SUPER_ADMIN)', sub: 'resolved by header signature · the same list the editor’s diagDates() logs', rows: mt, cols: [{ k: 'label', h: 'Source', l: 1 }, { k: 'tab', h: 'Tab in the file', l: 1 }, { k: 'headerRow', h: 'Header row', t: 'n0' }, { k: 'key', h: 'Signature', l: 1 }], emptyTitle: 'None' });
  return h + dqCard('help-dq') + '<div class="box"><div class="cb muted">RAG: green ≥ 100% of target, amber ≥ 90%, red below (reversed for lower-is-better). Goals scale with logins (agent-days), never with calendar days.</div></div>';
};

/* ======================= header, publish, boot ======================= */
function headerRender() {
  var i = S.init, u = i.user, pm = i.publishedMeta;
  $('#hPub').textContent = pm ? 'Last published: ' + localTs(pm.ts) + ' by ' + (pm.by || '').split('@')[0] : 'Not published yet';
  $('#hBuild').textContent = 'BUILD ' + i.build; $('#hRole').textContent = u.role; $('#hRole').className = 'badge' + (u.role === 'SUPER_ADMIN' ? ' sa' : ''); $('#hEmail').textContent = u.email;
  var sa = u.role === 'SUPER_ADMIN'; ['btnRefresh', 'btnPublish', 'btnEmail'].forEach(function (id) { $('#' + id).style.display = sa ? '' : 'none'; });
  $('#hMode').innerHTML = sa ? '<select id="hModeSel" title="Data shown"><option value="published"' + (i.mode === 'published' ? ' selected' : '') + '>Published</option><option value="live"' + (i.mode === 'live' ? ' selected' : '') + '>Live (sheet)</option>' + ((i.snapshots && i.snapshots.list) || []).slice(0, 20).map(function (s) { return '<option value="snap:' + s.id + '"' + (S.mode === 'snap:' + s.id ? ' selected' : '') + '>Snapshot ' + esc(localTs(s.ts)) + '</option>'; }).join('') + '</select>' : '<span class="badge">Published data</span>';
  $('#foot').textContent = 'iOPEX Technologies | Shared Services – MIS & Analytics | BUILD ' + i.build;
}
function devBar() {
  if (IS_GAS) return; var d = $('#dev'); fetch('/uat/users').then(function (r) { return r.json(); }).then(function (us) {
    d.style.display = 'flex'; d.innerHTML = 'UAT user <select id="devUser">' + us.map(function (u) { return '<option value="' + esc(u[0]) + '"' + ((UAT_USER === null ? 'yogeesha.babumoole@iopex.com' : UAT_USER) === u[0] ? ' selected' : '') + '>' + esc(u[1]) + '</option>'; }).join('') + '</select>';
    $('#devUser').addEventListener('change', function (e) { location.search = '?as=' + encodeURIComponent(e.target.value); });
  }).catch(function () { });
}
function renderDenied(i) {
  $('#splash').style.display = 'none'; $('#app').style.display = 'block'; $('#hdr').style.display = 'none'; $('#nav').style.display = 'none'; $('#fb').style.display = 'none'; $('#main').style.marginLeft = '0'; $('#foot').style.marginLeft = '0';
  $('#page').innerHTML = '<div class="denied" id="deniedWrap"><span class="logo" style="height:44px;width:192px;background-position:center"></span><h2>Access denied</h2><p>' + esc(i.reason || 'You do not have access to this dashboard.') + '</p>' + (i.email ? '<p class="muted">Signed in as ' + esc(i.email) + '</p>' : '') +
    (i.canRequest ? '<p><textarea class="tin" id="rqNote" placeholder="Why do you need access? (optional)" style="max-width:380px"></textarea></p><button class="btn pri" data-act="reqaccess">Request access</button>' : '') + '<p class="muted" style="margin-top:16px">NewsBreak LOB Dashboard · BUILD ' + esc(i.build) + '</p></div>';
  $('#foot').textContent = 'iOPEX Technologies | Shared Services – MIS & Analytics | BUILD ' + i.build; devBar();
}
ACT.reqaccess = function () { api('apiRequestAccess', ($('#rqNote') || {}).value || '').then(function (r) { toast(r.already ? 'You already have a pending request' : 'Request sent to the SUPER_ADMINs'); $('#deniedWrap').innerHTML += '<p class="pill g">Request recorded</p>'; }).catch(function (e) { toast(e.message, true); }); };
function setup(i, keepPage) {
  S.init = i; if (i.denied) { renderDenied(i); return; }
  S.ds = i.ds || { prod: [], att: [], iv: [], rj: [], man: [], rat: [], med: [], tt: [], ros: {}, caps: {}, dq: {}, range: ['', ''] }; S.o = LIB.settings(i.settings); S.T = i.targets || []; S.mode = i.mode === 'none' ? 'published' : i.mode; S.emptyReason = i.empty ? i.reason : '';
  LIB.enrich(S.ds, S.o);
  var dm = {}; ['prod', 'att', 'iv'].forEach(function (k) { S.ds[k].forEach(function (r) { dm[r.d] = 1; }); }); S.dts = Object.keys(dm).sort();
  S.preset = 'thisMonth'; setTheme(THEME_FORCE || i.theme || 'dark', false); S.f = defaultFilter(); S.p = clone(S.f); S.ch.from = S.f.from; S.ch.to = S.f.to; S.ch.agents = []; S.ui.sub = { VM: 'ALL', CM: 'ALL', AM: 'ALL' }; refilter();
  $('#splash').style.display = 'none'; $('#app').style.display = 'block'; headerRender(); fbRender();
  if (!keepPage || !PAGES.some(function (p) { return p.id === S.page && allowed(p); })) S.page = 'overview';
  navRender(); var pg = PAGES.filter(function (p) { return p.id === S.page; })[0]; $('#fb').style.display = pg && pg.f ? '' : 'none'; ADM = null; ACC = null; renderPage(); devBar();
}
function loadInit(mode, keepPage) {
  $('#page').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  var t0 = Date.now(), sp = $('#splash'), msg = sp ? sp.lastElementChild : null, tick = setInterval(function () { var s = Math.round((Date.now() - t0) / 1000); if (msg && sp.style.display !== 'none') msg.textContent = s < 8 ? 'Loading NewsBreak LOB Dashboard…' : 'Reading the source sheet… ' + s + 's' + (s > 30 ? ' (the very first load reads every tab — please keep this page open)' : ''); }, 1000);
  return api('apiInit', mode || undefined).then(function (i) { clearInterval(tick); setup(i, keepPage); }).catch(function (e) { clearInterval(tick); $('#splash').style.display = 'none'; $('#app').style.display = 'block'; $('#page').innerHTML = '<div class="card"><div class="empty"><b>The dashboard could not load</b>' + esc(e.message) + '<p><button class="btn" onclick="loadInit()">Retry</button></p></div></div>'; });
}
function doRefresh() { var b = $('#btnRefresh'); b.disabled = true; api('apiRefresh').then(function (r) { toast('Refreshed from the sheet (' + r.rows + ' agent-day rows)'); return loadInit(S.mode, true); }).catch(function (e) { toast(e.message, true); }).then(function () { b.disabled = false; }); }
function doPublish() {
  var b = $('#btnPublish'); if (b.disabled) return; var label = ''; b.disabled = true; b.textContent = 'Publishing…';
  api('apiPublish', label).then(function (r) { toast('Published ' + localTs(r.meta.ts) + (r.emailed ? ' · email sent' : '') + (r.emailError ? ' · email failed: ' + r.emailError : ''), !!r.emailError); S.mode = 'published'; return loadInit('published', true); }).catch(function (e) { toast(e.message, true); }).then(function () { b.disabled = false; b.textContent = 'Publish'; });
}
loadInit();
</script>
